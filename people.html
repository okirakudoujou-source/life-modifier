<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>今まで作った人</title>


    <style>

        /* ========================================
           全体
        ======================================== */

        body {
            margin: 0;
            background: #181818;
            color: #eeeeee;
            font-family: Arial, "Noto Sans JP", sans-serif;
        }


        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }


        /* ========================================
           タイトル
        ======================================== */

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }


        /* ========================================
           セクション
        ======================================== */

        .section {
            margin-bottom: 45px;
        }


        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }


            .section-title::after {
                content: "";
                flex: 1;
                height: 1px;
                background: #444444;
            }


        .normal-title {
            color: #aaaaaa;
        }


        .random-title {
            color: #777777;
        }


        /* ========================================
           人物カード
        ======================================== */

        .person {
            background: #242424;
            border: 1px solid #3d3d3d;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }


            .person:hover {
                background: #2d2d2d;
                border-color: #666666;
            }


        /* ========================================
           人物カード上段
        ======================================== */

        .person-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        /* ========================================
           人物名
        ======================================== */

        .person-name {
            font-size: 20px;
            font-weight: bold;
        }


        /* ========================================
           右側の数値
        ======================================== */

        .person-total {
            font-size: 18px;
            font-weight: bold;
        }


        /* ========================================
           数値の色

           マイナス = 緑
           プラス   = 赤
           0        = 灰
        ======================================== */

        .positive {
            color: #55cc77;
        }


        .negative {
            color: #ff5555;
        }


        .zero {
            color: #aaaaaa;
        }


        /* ========================================
           モード表示
        ======================================== */

        .person-mode {
            margin-top: 6px;
            color: #777777;
            font-size: 12px;
        }


        /* ========================================
           人物がいない場合
        ======================================== */

        .empty {
            color: #666666;
            text-align: center;
            padding: 30px 0;
        }


        /* ========================================
           戻る
        ======================================== */

        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #888888;
            text-decoration: none;
        }


            .back:hover {
                color: white;
            }


        /* ========================================
           管理
        ======================================== */

        .admin-area {
            margin-top: 100px;
            padding-top: 15px;
            border-top: 1px solid #242424;
            color: #555555;
            font-size: 12px;
        }


            .admin-area summary {
                cursor: pointer;
                color: #555555;
            }


                .admin-area summary:hover {
                    color: #777777;
                }


        .admin-content {
            margin-top: 15px;
            background: #1d1d1d;
            border: 1px solid #292929;
            border-radius: 8px;
            padding: 15px;
        }


        /* ========================================
           全削除ボタン
        ======================================== */

        #deleteAll {
            background: #351f1f;
            color: #aa6666;
            border: 1px solid #4a2929;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 12px;
        }


            #deleteAll:hover {
                background: #4a2525;
                color: #dd7777;
            }


        /* ========================================
           個別削除ボタン
        ======================================== */

        #deleteIndividual {
            background: #292929;
            color: #888888;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }


            #deleteIndividual:hover {
                background: #333333;
                color: #aaaaaa;
                border-color: #555555;
            }


        #deleteIndividual.delete-mode {
            background: #351f1f;
            color: #cc7777;
            border-color: #4a2929;
        }


            #deleteIndividual.delete-mode:hover {
                background: #4a2525;
                color: #dd7777;
            }
    </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>


    <div class="container">


        <!-- ========================================
             タイトル
        ======================================== -->

        <h1>
            今まで作った人
        </h1>


        <!-- ========================================
             通常生成
        ======================================== -->

        <section class="section">

            <div class="section-title normal-title">

                通常生成

            </div>


            <div id="normalPeople"></div>

        </section>


        <!-- ========================================
             ランダム生成
        ======================================== -->

        <section class="section">

            <div class="section-title random-title">

                ランダム生成

            </div>


            <div id="randomPeople"></div>

        </section>


        <!-- ========================================
             戻る
        ======================================== -->

        <a class="back"
           href="index.html">

            ← モディファイアを選ぶ

        </a>


        <!-- ========================================
             管理
        ======================================== -->

        <details class="admin-area">

            <summary>
                管理
            </summary>


            <div class="admin-content">

                <button id="deleteAll">

                    登録データをすべて削除

                </button>


                <button id="deleteIndividual">

                    個別削除

                </button>

            </div>

        </details>


    </div>



    <script>

        /* ==================================================
        Supabase
        ================================================== */

        const SUPABASE_URL =
        "https://lktkcaicxkelczdmtbwm.supabase.co";

        const SUPABASE_KEY =
        "sb_publishable_ok4J9vo7cyId75h7rl0-yg_LqqjVhRV";

        const db =
        window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
        );


        /* ==================================================
        HTML
        ================================================== */

        const normalArea =
        document.getElementById(
        "normalPeople"
        );

        const randomArea =
        document.getElementById(
        "randomPeople"
        );


        /* ==================================================
        合計計算
        ================================================== */

        function calculateTotal(person) {

        let total = 0;

        if (
        Array.isArray(
        person.modifiers
        )
        ) {

        person.modifiers.forEach(
        function(modifier) {

        total +=
        Number(
        modifier.score
        ) || 0;

        }
        );

        }

        return total;

        }


        /* ==================================================
        数値の色
        ================================================== */

        function getScoreClass(score) {

        if (score < 0) {

        return "positive";

        }

        if (score > 0) {

        return "negative";

        }

        return "zero";

        }


        /* ==================================================
        人物カード
        ================================================== */

        function createPersonCard(person) {

        const element =
        document.createElement(
        "div"
        );

        element.className =
        "person";


        const total =
        calculateTotal(
        person
        );


        let rightText;
        let rightClass = "";


        if (
        person.random === true
        ) {

        const sign =
        total > 0
        ? "+"
        : "";

        rightText =
        `${sign}${total}`;

        rightClass =
        getScoreClass(
        total
        );

        }

        else {

        const count =
        Array.isArray(
        person.modifiers
        )
        ?
        person.modifiers.length
        :
        0;

        rightText =
        `${count}個`;

        rightClass =
        "zero";

        }


        element.innerHTML = `

        <div class="person-header">

        <div class="person-name">
        ${person.name}
        </div>

        <div
        class="person-total ${rightClass}">

        ${rightText}

        </div>

        </div>

        `;


        element.onclick =
        async function() {

        /*
        * 個別削除モード
        */

        if (individualDeleteMode) {

        const confirmed =
        confirm(
        "「" +
        person.name +
        "」を削除しますか？"
        );


        if (!confirmed) {

        return;

        }


        const correctPassword =
        "1234";


        const password =
        prompt(
        "管理パスワードを入力してください"
        );


        if (password === null) {

        return;

        }


        if (
        password.trim()
        !==
        correctPassword
        ) {

        alert(
        "パスワードが違います。"
        );

        return;

        }


        const { error } =
        await db
        .from("people")
        .delete()
        .eq(
        "id",
        person.id
        );


        if (error) {

        console.error(error);

        alert(
        "削除に失敗しました。\n" +
        error.message
        );

        return;

        }


        alert(
        "「" +
        person.name +
        "」を削除しました。"
        );


        individualDeleteMode =
        false;


        deleteIndividualButton.textContent =
        "個別削除";


        deleteIndividualButton.classList.remove(
        "delete-mode"
        );


        loadPeople();

        return;

        }


        /*
        * 通常時は結果画面へ
        */

        window.location.href =
        "result.html?id=" +
        encodeURIComponent(
        person.id
        );

        };


        return element;

        }


        /* ==================================================
        人物一覧を取得
        ================================================== */

        async function loadPeople() {

        normalArea.innerHTML =
        '<div class="empty">読み込み中...</div>';

        randomArea.innerHTML =
        '<div class="empty">読み込み中...</div>';


        const { data, error } =
        await db
        .from("people")
        .select("*")
        .order(
        "created_at",
        { ascending: false }
        );


        if (error) {

        console.error(error);

        normalArea.innerHTML = `
        <div class="empty">
        データの読み込みに失敗しました。<br>
        ${error.message}
        </div>
        `;

        randomArea.innerHTML = "";

        return;

        }


        normalArea.innerHTML = "";
        randomArea.innerHTML = "";


        let normalCount = 0;
        let randomCount = 0;


        data.forEach(
        function(person) {

        const card =
        createPersonCard(
        person
        );


        if (
        person.random === true
        ) {

        randomArea.appendChild(
        card
        );

        randomCount++;

        }

        else {

        normalArea.appendChild(
        card
        );

        normalCount++;

        }

        }
        );


        if (
        normalCount === 0
        ) {

        normalArea.innerHTML = `
        <div class="empty">
        まだ通常生成された人物はいません。
        </div>
        `;

        }


        if (
        randomCount === 0
        ) {

        randomArea.innerHTML = `
        <div class="empty">
        まだランダム生成された人物はいません。
        </div>
        `;

        }

        }


        /* ==================================================
        全データ削除
        ================================================== */

        const deleteAllButton =
        document.getElementById(
        "deleteAll"
        );


        if (
        deleteAllButton
        ) {

        deleteAllButton.addEventListener(
        "click",
        async function() {

        const correctPassword =
        "1234";


        const password =
        prompt(
        "管理パスワードを入力してください"
        );


        if (
        password === null
        ) {

        return;

        }


        if (
        password.trim()
        !==
        correctPassword
        ) {

        alert(
        "パスワードが違います。"
        );

        return;

        }


        const confirmed =
        confirm(
        "登録されている人物データをすべて削除します。\n\n本当に削除しますか？"
        );


        if (
        !confirmed
        ) {

        return;

        }


        const { error } =
        await db
        .from("people")
        .delete()
        .gte(
        "id",
        0
        );


        if (error) {

        console.error(error);

        alert(
        "データの削除に失敗しました。\n" +
        error.message
        );

        return;

        }


        alert(
        "すべての人物データを削除しました。"
        );


        window.location.reload();

        }
        );

        }


        /* ==================================================
        個別削除モード
        ================================================== */

        const deleteIndividualButton =
        document.getElementById(
        "deleteIndividual"
        );


        let individualDeleteMode =
        false;


        if (
        deleteIndividualButton
        ) {

        deleteIndividualButton.addEventListener(
        "click",
        function() {

        individualDeleteMode =
        !individualDeleteMode;


        if (individualDeleteMode) {

        deleteIndividualButton.textContent =
        "個別削除を終了";

        deleteIndividualButton.classList.add(
        "delete-mode"
        );

        alert(
        "削除したい人物をクリックしてください。"
        );

        }

        else {

        deleteIndividualButton.textContent =
        "個別削除";

        deleteIndividualButton.classList.remove(
        "delete-mode"
        );

        }

        }
        );

        }


        /* ==================================================
        初期表示
        ================================================== */

        loadPeople();

    </script>


</body>

</html>
