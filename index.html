        /* ========================================
           全体
        ======================================== */

        body {
            margin: 0;
            background: #181818;
            color: #eeeeee;
            font-family: Arial, "Noto Sans JP", sans-serif;
        }


        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 100px;
        }


        h1 {
            text-align: center;
            margin-bottom: 30px;
        }


        /* ========================================
           合計
        ======================================== */

        #score {
            position: sticky;
            top: 10px;
            z-index: 10;
            background: #252525;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 35px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }


        /* ========================================
           大分類
        ======================================== */

        .category-section {
            margin-bottom: 55px;
        }


        .category-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444444;
        }


        /* ========================================
           大分類の色
        ======================================== */

        .category-brain .category-title {
            color: #aaaaaa;
        }


        .category-body .category-title {
            color: #aaaaaa;
        }


        .category-look .category-title {
            color: #aaaaaa;
        }


        /* ========================================
           BUFF / DEBUFF / NEUTRAL
        ======================================== */

        .type-section {
            margin-bottom: 30px;
        }


        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }


            .section-title::after {
                content: "";
                flex: 1;
                height: 1px;
                background: #444;
            }


        .buff-title {
            color: #55cc77;
        }


        .debuff-title {
            color: #ff5555;
        }


        .neutral-title {
            color: #aaaaaa;
        }


        /* ========================================
           モディファイア一覧
        ======================================== */

        .modifier-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }


        /* ========================================
           モディファイアカード
        ======================================== */

        .modifier {
            background: #242424;
            border: 1px solid #3d3d3d;
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, opacity 0.15s;
        }


            .modifier:hover {
                background: #2d2d2d;
                border-color: #666;
            }


            .modifier.selected {
                background: #353535;
                border-color: #aaaaaa;
                box-shadow: 0 0 0 1px #aaaaaa;
            }


            /* ========================================
           競合している項目
        ======================================== */

            .modifier.conflict-disabled {
                opacity: 0.28;
                cursor: not-allowed;
            }


                .modifier.conflict-disabled:hover {
                    background: #242424;
                    border-color: #3d3d3d;
                }


        /* ========================================
           カード内部
        ======================================== */

        .modifier-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }


        .modifier-name {
            font-size: 20px;
            font-weight: bold;
        }


        .modifier-score {
            font-size: 22px;
            font-weight: bold;
        }


        /* ========================================
           数値

           BUFF  = マイナス = 緑
           DEBUFF = プラス = 赤
        ======================================== */

        .positive {
            color: #55cc77;
        }


        .negative {
            color: #ff5555;
        }


        .zero {
            color: #aaaaaa;
        }


        .description {
            color: #999999;
            font-size: 13px;
            line-height: 1.6;
        }


        /* ========================================
           確定ボタン
        ======================================== */

        #confirmButton {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            background: #444444;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }


            #confirmButton:hover {
                background: #555555;
            }


            #confirmButton:disabled {
                background: #292929;
                color: #666666;
                cursor: not-allowed;
            }


        /* ========================================
           人物一覧
        ======================================== */

        #peopleLink {

            text-align: center;
            margin-top: 20px;
            color: #888888;
            text-decoration: none;

           ランダム生成
        ======================================== */

            padding-top: 25px;
            padding-bottom: 80px;
            border-top: 1px solid #292929;

        /* ========================================

                grid-template-columns: 1fr;
            }


            #score {
                font-size: 24px;
            }


            .category-title {
                font-size: 22px;
            }
        }
    </style>

        /* ==================================================

        ================================================== */

        function isSelectedByName(name) {

        return selected.some(
        function(index) {

        return modifiers[index].name === name;

        }
        );

        }



        /* ==================================================
        競合判定
        ================================================== */

        function isConflicting(index) {

        const targetName =
        modifiers[index].name;


        for (
        let i = 0;
        i < conflicts.length;
        i++
        ) {

        const pair =
        conflicts[i];


        const itemA =
        pair[0];


        const itemB =
        pair[1];


        if (
        targetName === itemA &&
        isSelectedByName(itemB)
        ) {

        return true;

        }


        if (
        targetName === itemB &&
        isSelectedByName(itemA)
        ) {

        return true;

        }

        }


        return false;

        }



        /* ==================================================
        天才

        function hasGenius() {

        return selected.some(
        function(index) {

        return modifiers[index].name === "天才";

        );

        function generateTalent() {

        if (!hasGenius()) {

        currentTalent = null;

        return;

        if (currentTalent) {

        return;

        const randomIndex =
        Math.floor(
        Math.random() * talents.length

        /* ==================================================
        数値による並び順
        ==================================================

        数値の絶対値が大きいものを上にする。

        -12
        -8
        -6
        -3
        -2
        -1

        という順番。

        ================================================== */

        function sortModifiers(array) {

        return [...array].sort(
        function(a, b) {

        return (
        Math.abs(b.score)
        -
        Math.abs(a.score)
        );

        }
        );

        }



        /* ==================================================

        ================================================== */

        function createModifierCard(
        modifier,
        index
        ) {

        const card =
        document.createElement("div");


        card.className =
        "modifier";


        if (
        selected.includes(index)
        ) {

        card.classList.add("selected");

        }


        const conflict =
        !selected.includes(index)
        &&
        isConflicting(index);


        if (conflict) {

        card.classList.add(
        "conflict-disabled"
        );

        }


        let scoreClass;


        /*
        * マイナス = BUFF = 緑
        * プラス   = DEBUFF = 赤
        */

        if (
        modifier.score < 0
        ) {

        scoreClass =
        "positive";

        }

        else if (
        modifier.score > 0
        ) {

        scoreClass =
        "negative";

        }

        else {

        scoreClass =
        "zero";

        }


        const sign =
        modifier.score > 0
        ? "+"
        : "";


        card.innerHTML = `

        <div class="modifier-header">

        <div class="modifier-name">

        ${modifier.name}

        </div>


        <div
        class="modifier-score ${scoreClass}">

        ${sign}${modifier.score}

        </div>

        </div>


        <div class="description">

        ${modifier.description}

        </div>

        `;


        card.onclick =
        function() {


        /*
        * 選択解除
        */

        if (
        selected.includes(index)
        ) {

        selected =
        selected.filter(
        function(i) {

        return i !== index;

        }
        );


        if (
        modifier.name === "天才"
        ) {

        currentTalent =
        null;

        }

        }


        /*
        * 選択
        */

        else {

        if (
        isConflicting(index)
        ) {

        return;

        }


        selected.push(index);

        }


        generateTalent();

        displayModifiers();

        calculateScore();

        };


        return card;

        }
